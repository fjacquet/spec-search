[project]
name = "spec-search-mcp"
version = "1.0.0"
description = "MCP server for SPEC benchmark search (CPU2017 and JBB2015)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["fastmcp>=3.2.3", "pandas>=3.0.2"]

[project.scripts]
spec-search-mcp = "spec_search_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spec_search_mcp"]

[tool.hatch.build.targets.wheel.force-include]
"src/spec_search_mcp/data/cpu2017-results.csv.gz" = "spec_search_mcp/data/cpu2017-results.csv.gz"
"src/spec_search_mcp/data/jbb2015-results.csv.gz" = "spec_search_mcp/data/jbb2015-results.csv.gz"

[dependency-groups]
dev = ["pytest>=9.0.3", "ruff>=0.15.10", "pip-audit>=2.10.0", "cyclonedx-bom>=7.3.0"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
